<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRATE</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--surface2:#1a1a1a;--border:#222;--border2:#2e2e2e;--text:#f0ede6;--muted:#666;--muted2:#444;--accent:#c8f060;--accent2:#8ff0a0;--red:#ff5f5f;--amber:#ffb830;--blue:#60b8ff;}
*{box-sizing:border-box;margin:0;padding:0;}html{font-size:14px;}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.shell{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:220px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;}
.logo{padding:26px 24px 18px;border-bottom:1px solid var(--border);}
.logo-word{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;letter-spacing:4px;color:var(--accent);}
.logo-sub{font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:4px;text-transform:uppercase;}
.nav{padding:18px 0;flex:1;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 24px;cursor:pointer;font-size:12px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;transition:color .15s;border-left:2px solid transparent;user-select:none;}
.nav-item:hover{color:var(--text);}.nav-item.active{color:var(--accent);border-left-color:var(--accent);}
.nav-item svg{width:14px;height:14px;flex-shrink:0;}
.nav-count{margin-left:auto;background:var(--border);color:var(--muted);font-size:10px;padding:2px 7px;border-radius:20px;}
.nav-item.active .nav-count{background:#1e2a10;color:var(--accent);}
.sidebar-stats{padding:14px 24px;border-top:1px solid var(--border);}
.sidebar-stat{display:flex;justify-content:space-between;align-items:center;padding:3px 0;}
.sidebar-stat-label{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.sidebar-stat-val{font-size:12px;font-weight:500;}
.import-btn{margin:10px 14px 14px;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:6px;border:1px dashed var(--border2);background:transparent;color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;transition:all .15s;justify-content:center;}
.import-btn:hover{border-color:var(--accent);color:var(--accent);}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{padding:14px 26px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.search-wrap{position:relative;flex:1;min-width:160px;max-width:280px;}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--muted);pointer-events:none;}
.search{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:12px;padding:7px 10px 7px 30px;border-radius:6px;outline:none;}
.search:focus{border-color:var(--border2);}.search::placeholder{color:var(--muted2);}
select{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:12px;padding:7px 10px;border-radius:6px;outline:none;cursor:pointer;}
.topbar-right{margin-left:auto;display:flex;gap:8px;}
.btn{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text);font-family:'DM Mono',monospace;font-size:12px;cursor:pointer;transition:all .15s;}
.btn:hover{border-color:var(--border2);background:var(--surface);}
.btn-accent{background:var(--accent);color:#0a0a0a;border-color:var(--accent);font-weight:500;}
.btn-accent:hover{background:#d4f570;border-color:#d4f570;}
.btn-danger{background:transparent;border-color:#3a1a1a;color:var(--red);}
.btn-danger:hover{background:#1a0808;border-color:var(--red);}
.btn svg{width:13px;height:13px;}
.content{flex:1;overflow-y:auto;padding:22px 26px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;}
.album-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:border-color .15s,transform .15s;position:relative;cursor:pointer;}
.album-card:hover{border-color:var(--border2);transform:translateY(-2px);}
.album-art{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:38px;position:relative;background:var(--surface2);overflow:hidden;}
.album-art img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.album-art-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 50%,rgba(0,0,0,.6));}
.album-art-emoji{position:relative;z-index:1;}
.album-card-body{padding:10px 12px;}
.album-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s;}
.album-title:hover{color:var(--accent);}
.album-artist{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.album-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
.format-badge{font-size:10px;padding:2px 7px;border-radius:3px;font-weight:500;}
.fmt-flac{background:#0d2010;color:var(--accent2);border:1px solid #1a4020;}
.fmt-mp3{background:#0d1a2a;color:var(--blue);border:1px solid #1a3050;}
.fmt-bc{background:#1a1000;color:var(--amber);border:1px solid #3a2800;}
.stars-row{display:flex;gap:2px;}
.star{font-size:11px;color:var(--muted2);cursor:pointer;transition:color .1s;}.star.on{color:var(--amber);}
.card-actions{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .15s;}
.album-card:hover .card-actions{opacity:1;}
.card-action-btn{width:26px;height:26px;border-radius:5px;border:1px solid rgba(255,255,255,.12);background:rgba(10,10,10,.85);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;backdrop-filter:blur(4px);}
.card-action-btn:hover{color:var(--text);border-color:rgba(255,255,255,.25);}
.card-action-btn svg{width:11px;height:11px;}
.budget-bar{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:20px;}
.budget-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
.budget-total{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;color:var(--accent);}
.budget-divider{width:1px;height:32px;background:var(--border);}
.wish-list{display:flex;flex-direction:column;gap:6px;}
.wish-row{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:12px;transition:border-color .15s;cursor:pointer;}
.wish-row:hover{border-color:var(--border2);}.wish-row.bought{opacity:.4;}
.priority-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.p-high{background:var(--red);box-shadow:0 0 6px rgba(255,95,95,.4);}
.p-mid{background:var(--amber);}.p-low{background:var(--muted2);}
.wish-art{width:40px;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:var(--surface2);overflow:hidden;position:relative;}
.wish-art img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.wish-art-emoji{position:relative;z-index:1;}
.wish-info{flex:1;min-width:0;}
.wish-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s;}
.wish-info:hover .wish-title{color:var(--accent);}
.wish-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.wish-note{font-size:10px;color:var(--muted2);font-style:italic;margin-top:2px;}
.wish-meta{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.price-tag{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;}
.genre-pill{font-size:10px;padding:2px 8px;border-radius:20px;background:#1e1e1e;color:var(--muted);border:1px solid var(--border);}
.buy-btn{padding:5px 11px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.buy-btn:hover{border-color:var(--accent);color:var(--accent);}
.owned-pill{font-size:10px;padding:3px 10px;border-radius:20px;background:#0d2010;color:var(--accent2);border:1px solid #1a4020;}
.icon-btn{width:26px;height:26px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0;}
.icon-btn:hover{color:var(--text);border-color:var(--border2);}
.icon-btn svg{width:11px;height:11px;}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-backdrop.open{opacity:1;pointer-events:all;}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:10px;width:500px;max-width:96vw;max-height:90vh;overflow-y:auto;padding:24px;transform:translateY(10px);transition:transform .2s;}
.modal-backdrop.open .modal{transform:translateY(0);}
.modal-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:16px;}
.field{margin-bottom:11px;}
.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);font-family:'DM Mono',monospace;font-size:12px;padding:8px 10px;border-radius:6px;outline:none;transition:border-color .15s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
.field textarea{resize:vertical;min-height:50px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--muted);}.btn-ghost:hover{color:var(--text);}
.mb-search-wrap{position:relative;}.mb-search-wrap input{padding-right:76px;}
.mb-search-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:4px 10px;border-radius:4px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;transition:all .15s;}
.mb-search-btn:hover{border-color:var(--accent);color:var(--accent);}
.mb-results{margin-top:8px;display:flex;flex-direction:column;gap:5px;max-height:200px;overflow-y:auto;}
.mb-result{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;border:1px solid var(--border);cursor:pointer;transition:border-color .15s;}
.mb-result:hover{border-color:var(--border2);}.mb-result.selected{border-color:var(--accent);background:#1a2510;}
.mb-result-art{width:34px;height:34px;border-radius:4px;background:var(--surface2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;overflow:hidden;}
.mb-result-art img{width:100%;height:100%;object-fit:cover;}
.mb-result-info{flex:1;min-width:0;}
.mb-result-title{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mb-result-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.mb-loading{text-align:center;padding:14px;font-size:11px;color:var(--muted);}
.mb-divider{display:flex;align-items:center;gap:10px;margin:14px 0 10px;}
.mb-divider span{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;white-space:nowrap;}
.mb-divider::before,.mb-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.art-preview{display:none;align-items:center;gap:10px;margin-top:10px;padding:8px 10px;background:var(--surface2);border-radius:6px;border:1px solid var(--border);}
.art-preview img{width:44px;height:44px;border-radius:5px;object-fit:cover;}
.art-preview-label{font-size:11px;color:var(--muted);}
.edit-art-wrap{display:flex;gap:14px;margin-bottom:14px;align-items:flex-start;}
.edit-art-thumb{width:80px;height:80px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;overflow:hidden;border:1px solid var(--border);}
.edit-art-thumb img{width:100%;height:100%;object-fit:cover;}
.edit-art-side{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;}
.edit-stars{display:flex;gap:4px;}
.edit-star{font-size:20px;color:var(--muted2);cursor:pointer;transition:color .1s;}.edit-star.on{color:var(--amber);}
.del-confirm{background:#160808;border:1px solid #3a1212;border-radius:8px;padding:14px;margin-top:12px;display:none;}
.del-confirm.show{display:block;}
.del-confirm p{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.5;}
.bc-steps{margin:12px 0;}
.bc-step{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);}
.bc-step:last-child{border-bottom:none;}
.bc-step-num{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#0a0a0a;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.bc-step-text{font-size:12px;color:var(--muted);line-height:1.6;}
.bc-step-text a{color:var(--accent);text-decoration:none;}.bc-step-text a:hover{text-decoration:underline;}
.drop-zone{border:2px dashed var(--border2);border-radius:8px;padding:26px;text-align:center;cursor:pointer;transition:all .15s;margin-top:14px;}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent);background:#0f1a08;}
.drop-zone-icon{font-size:26px;margin-bottom:8px;}
.drop-zone-text{font-size:12px;color:var(--muted);}.drop-zone-text strong{color:var(--text);}
.toast{position:fixed;bottom:22px;right:22px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:10px 16px;font-size:12px;color:var(--text);transform:translateY(20px);opacity:0;transition:all .2s;pointer-events:none;z-index:200;display:flex;align-items:center;gap:8px;}
.toast.show{transform:translateY(0);opacity:1;}
.toast-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;}
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:12px;letter-spacing:1px;}
.empty-icon{font-size:34px;margin-bottom:12px;}
.empty-hint{margin-top:6px;font-size:11px;color:var(--muted2);}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="logo"><div class="logo-word">CRATE</div><div class="logo-sub">music collection</div></div>
    <nav class="nav">
      <div class="nav-item active" onclick="setTab('library')" id="nav-library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="12" x2="9" y2="12"/><line x1="15" y1="12" x2="21" y2="12"/></svg>
        Library <span class="nav-count" id="lib-count">0</span>
      </div>
      <div class="nav-item" onclick="setTab('wishlist')" id="nav-wishlist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        Wishlist <span class="nav-count" id="wish-count">0</span>
      </div>
    </nav>
    <div class="sidebar-stats">
      <div class="sidebar-stat"><span class="sidebar-stat-label">FLAC</span><span class="sidebar-stat-val" id="stat-flac">0</span></div>
      <div class="sidebar-stat"><span class="sidebar-stat-label">MP3</span><span class="sidebar-stat-val" id="stat-mp3">0</span></div>
      <div class="sidebar-stat"><span class="sidebar-stat-label">Avg rating</span><span class="sidebar-stat-val" id="stat-rating">--</span></div>
    </div>
    <button class="import-btn" onclick="openImport()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      import bandcamp csv
    </button>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search" type="text" placeholder="search artist, album..." id="search" oninput="render()"/>
      </div>
      <select id="genre-filter" onchange="render()">
        <option value="">all genres</option>
        <option>hyperpop</option><option>digicore</option><option>electronic</option>
        <option>hip-hop</option><option>experimental</option><option>ambient</option><option>noise</option>
      </select>
      <div class="topbar-right">
        <button class="btn btn-accent" onclick="openAdd()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          add
        </button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="modal-backdrop" id="add-modal" onclick="bgClose(event,'add-modal')">
  <div class="modal">
    <div class="modal-title" id="add-modal-title">add to library</div>
    <div class="field">
      <label>search musicbrainz or paste release url / id</label>
      <div class="mb-search-wrap">
        <input type="text" id="mb-query" placeholder="artist +
