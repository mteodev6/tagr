<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRATE — music collection</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: #222222;
    --border2: #2e2e2e;
    --text: #f0ede6;
    --muted: #666;
    --muted2: #444;
    --accent: #c8f060;
    --accent2: #8ff0a0;
    --red: #ff5f5f;
    --amber: #ffb830;
    --blue: #60b8ff;
    --tag-bg: #1e1e1e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 14px; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* layout */
  .shell { display: flex; height: 100vh; overflow: hidden; }

  /* sidebar */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 0;
  }
  .logo {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--border);
  }
  .logo-word {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 4px;
    color: var(--accent);
  }
  .logo-sub {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-top: 4px;
    text-transform: uppercase;
  }
  .nav { padding: 20px 0; flex: 1; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 24px;
    cursor: pointer;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
    transition: color 0.15s;
    border-left: 2px solid transparent;
    user-select: none;
  }
  .nav-item:hover { color: var(--text); }
  .nav-item.active { color: var(--accent); border-left-color: var(--accent); }
  .nav-item svg { width: 15px; height: 15px; flex-shrink: 0; }
  .nav-count {
    margin-left: auto;
    background: var(--border);
    color: var(--muted);
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 20px;
  }
  .nav-item.active .nav-count { background: #1e2a10; color: var(--accent); }
  .sidebar-stats {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
  }
  .sidebar-stat { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
  .sidebar-stat-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .sidebar-stat-val { font-size: 12px; font-weight: 500; color: var(--text); }

  /* main */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* topbar */
  .topbar {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .search-wrap { position: relative; flex: 1; max-width: 320px; }
  .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--muted); pointer-events: none; }
  .search {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 8px 12px 8px 36px;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search:focus { border-color: var(--border2); }
  .search::placeholder { color: var(--muted2); }
  select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 6px;
    outline: none;
    cursor: pointer;
  }
  select:focus { border-color: var(--border2); }
  .topbar-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.5px;
  }
  .btn:hover { border-color: var(--border2); background: var(--surface); }
  .btn-accent { background: var(--accent); color: #0a0a0a; border-color: var(--accent); font-weight: 500; }
  .btn-accent:hover { background: #d4f570; border-color: #d4f570; }
  .btn svg { width: 13px; height: 13px; }

  /* content area */
  .content { flex: 1; overflow-y: auto; padding: 24px 28px; }

  /* wishlist budget bar */
  .budget-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .budget-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .budget-total { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; color: var(--accent); }
  .budget-items { font-size: 11px; color: var(--muted); }
  .budget-divider { width: 1px; height: 32px; background: var(--border); }

  /* grid for library */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .album-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s;
  }
  .album-card:hover { border-color: var(--border2); transform: translateY(-2px); }
  .album-art {
    width: 100%;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    position: relative;
  }
  .album-art-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.7));
  }
  .album-card-body { padding: 12px; }
  .album-title { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .album-artist { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .album-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .format-badge {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 3px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }
  .fmt-flac { background: #0d2010; color: var(--accent2); border: 1px solid #1a4020; }
  .fmt-mp3 { background: #0d1a2a; color: var(--blue); border: 1px solid #1a3050; }
  .stars-row { display: flex; gap: 2px; }
  .star { font-size: 11px; color: var(--muted2); cursor: pointer; transition: color 0.1s; }
  .star.on { color: var(--amber); }
  .star:hover { color: var(--amber); }

  /* wishlist rows */
  .wish-list { display: flex; flex-direction: column; gap: 6px; }
  .wish-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color 0.15s;
  }
  .wish-row:hover { border-color: var(--border2); }
  .wish-row.bought { opacity: 0.4; }
  .priority-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .p-high { background: var(--red); box-shadow: 0 0 6px rgba(255,95,95,0.4); }
  .p-mid { background: var(--amber); box-shadow: 0 0 6px rgba(255,184,48,0.4); }
  .p-low { background: var(--muted2); }
  .wish-art {
    width: 40px; height: 40px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .wish-info { flex: 1; min-width: 0; }
  .wish-title { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wish-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .wish-note { font-size: 10px; color: var(--muted2); font-style: italic; margin-top: 3px; }
  .wish-meta { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .price-tag {
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
  }
  .genre-pill {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 20px;
    background: var(--tag-bg);
    color: var(--muted);
    border: 1px solid var(--border);
    letter-spacing: 0.5px;
  }
  .buy-btn {
    padding: 5px 12px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    letter-spacing: 0.5px;
  }
  .buy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .owned-pill {
    font-size: 10px;
    padding: 3px 10px;
    border-radius: 20px;
    background: #0d2010;
    color: var(--accent2);
    border: 1px solid #1a4020;
    letter-spacing: 0.5px;
  }

  /* modal */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 10px;
    width: 440px;
    max-width: 95vw;
    padding: 28px;
    transform: translateY(10px);
    transition: transform 0.2s;
  }
  .modal-backdrop.open .modal { transform: translateY(0); }
  .modal-title {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 20px;
    color: var(--text);
  }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border2);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 9px 12px;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 60px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  .btn-ghost { background: transparent; border-color: var(--border); color: var(--muted); }
  .btn-ghost:hover { color: var(--text); }

  /* empty state */
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 12px; letter-spacing: 1px; }
  .empty-icon { font-size: 36px; margin-bottom: 12px; }

  /* toast */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 12px;
    color: var(--text);
    transform: translateY(20px); opacity: 0;
    transition: all 0.2s;
    pointer-events: none;
    z-index: 200;
    display: flex; align-items: center; gap: 8px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
</style>
</head>
<body>

<div class="shell">
  <!-- sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-word">CRATE</div>
      <div class="logo-sub">music collection</div>
    </div>
    <nav class="nav">
      <div class="nav-item active" onclick="setTab('library')" id="nav-library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="12" x2="9" y2="12"/><line x1="15" y1="12" x2="21" y2="12"/></svg>
        Library
        <span class="nav-count" id="lib-count">0</span>
      </div>
      <div class="nav-item" onclick="setTab('wishlist')" id="nav-wishlist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        Wishlist
        <span class="nav-count" id="wish-count">0</span>
      </div>
    </nav>
    <div class="sidebar-stats">
      <div class="sidebar-stat">
        <span class="sidebar-stat-label">FLAC</span>
        <span class="sidebar-stat-val" id="stat-flac">0</span>
      </div>
      <div class="sidebar-stat">
        <span class="sidebar-stat-label">MP3</span>
        <span class="sidebar-stat-val" id="stat-mp3">0</span>
      </div>
      <div class="sidebar-stat">
        <span class="sidebar-stat-label">Avg rating</span>
        <span class="sidebar-stat-val" id="stat-rating">—</span>
      </div>
    </div>
  </aside>

  <!-- main -->
  <main class="main">
    <div class="topbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search" type="text" placeholder="search artist, album..." id="search" oninput="render()" />
      </div>
      <select id="genre-filter" onchange="render()">
        <option value="">all genres</option>
        <option>hyperpop</option>
        <option>digicore</option>
        <option>electronic</option>
        <option>hip-hop</option>
        <option>experimental</option>
        <option>ambient</option>
        <option>noise</option>
      </select>
      <div class="topbar-right">
        <button class="btn btn-accent" onclick="openModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          add
        </button>
      </div>
    </div>

    <div class="content" id="content"></div>
  </main>
</div>

<!-- modal -->
<div class="modal-backdrop" id="modal-backdrop" onclick="closeModalBg(event)">
  <div class="modal">
    <div class="modal-title" id="modal-title">add to library</div>
    <div class="field-row">
      <div class="field"><label>artist</label><input type="text" id="f-artist" placeholder="e.g. Heaven Pierce Her" /></div>
      <div class="field"><label>album</label><input type="text" id="f-album" placeholder="e.g. Epitaph" /></div>
    </div>
    <div class="field-row">
      <div class="field"><label>year</label><input type="number" id="f-year" placeholder="2024" min="1900" max="2099" /></div>
      <div class="field"><label>genre</label>
        <select id="f-genre">
          <option value="">select...</option>
          <option>hyperpop</option><option>digicore</option><option>electronic</option>
          <option>hip-hop</option><option>experimental</option><option>ambient</option><option>noise</option>
        </select>
      </div>
    </div>
    <!-- library-only fields -->
    <div id="lib-fields">
      <div class="field-row">
        <div class="field"><label>format</label>
          <select id="f-format"><option>FLAC</option><option>MP3</option></select>
        </div>
        <div class="field"><label>source</label>
          <select id="f-source"><option>Bandcamp</option><option>Soulseek</option><option>Other</option></select>
        </div>
      </div>
      <div class="field"><label>notes</label><textarea id="f-notes" placeholder="optional notes..."></textarea></div>
    </div>
    <!-- wishlist-only fields -->
    <div id="wish-fields" style="display:none">
      <div class="field-row">
        <div class="field"><label>price ($)</label><input type="number" id="f-price" placeholder="12" min="0" step="0.01" /></div>
        <div class="field"><label>priority</label>
          <select id="f-priority"><option value="high">high</option><option value="mid" selected>mid</option><option value="low">low</option></select>
        </div>
      </div>
      <div class="field"><label>notes</label><input type="text" id="f-wish-notes" placeholder="e.g. wait for sale..." /></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">cancel</button>
      <button class="btn btn-accent" onclick="saveItem()">save</button>
    </div>
  </div>
</div>

<!-- toast -->
<div class="toast" id="toast"><div class="toast-dot"></div><span id="toast-msg"></span></div>

<script>
let tab = 'library';

let library = [
  { id:1, artist:'Heaven Pierce Her', album:'Epitaph', year:2023, genre:'hyperpop', format:'FLAC', source:'Bandcamp', rating:5, notes:'absolutely essential' },
  { id:2, artist:'JPEGMAFIA', album:'LP!', year:2021, genre:'experimental', format:'FLAC', source:'Bandcamp', rating:5, notes:'' },
  { id:3, artist:'femtanyl', album:'Girly', year:2022, genre:'digicore', format:'MP3', source:'Soulseek', rating:4, notes:'' },
  { id:4, artist:'Charli XCX', album:'Brat', year:2024, genre:'hyperpop', format:'FLAC', source:'Bandcamp', rating:4, notes:'' },
  { id:5, artist:'Machine Girl', album:'WLFGRL', year:2016, genre:'electronic', format:'FLAC', source:'Bandcamp', rating:5, notes:'classic' },
  { id:6, artist:'100 gecs', album:'10000 gecs', year:2023, genre:'hyperpop', format:'FLAC', source:'Bandcamp', rating:4, notes:'' },
];

let wishlist = [
  { id:1, artist:'JPEGMAFIA', album:'Scaring the Hoes', year:2023, genre:'experimental', price:12, priority:'high', notes:'w/ Danny Brown', bought:false },
  { id:2, artist:'Hannah Diamond', album:'Reflections', year:2019, genre:'hyperpop', price:8, priority:'mid', notes:'', bought:false },
  { id:3, artist:'Machine Girl', album:'NMBR', year:2020, genre:'electronic', price:10, priority:'low', notes:'wait for sale', bought:false },
  { id:4, artist:'Black Dresses', album:'Forget Your Own Face', year:2020, genre:'digicore', price:7, priority:'high', notes:'', bought:false },
  { id:5, artist:'yeule', album:'softscars', year:2023, genre:'experimental', price:9, priority:'mid', notes:'physical vinyl preferred', bought:false },
];

const artColors = ['#1a2510','#10181a','#1a1018','#181510','#101820','#1a1010','#121a10'];
const artEmojis = ['🎵','💿','🌀','⚡','🖤','🔊','🎧','💜','🧨','🌙'];

function hashStr(s) { let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h)+s.charCodeAt(i); return Math.abs(h); }
function artBg(s) { return artColors[hashStr(s) % artColors.length]; }
function artEmoji(s) { return artEmojis[hashStr(s) % artEmojis.length]; }

function setTab(t) {
  tab = t;
  document.getElementById('nav-library').classList.toggle('active', t==='library');
  document.getElementById('nav-wishlist').classList.toggle('active', t==='wishlist');
  document.getElementById('modal-title').textContent = t==='library' ? 'add to library' : 'add to wishlist';
  render();
}

function starsHtml(rating, id) {
  return Array.from({length:5},(_,i)=>
    `<span class="star${i<rating?' on':''}" onclick="rate(${id},${i+1})" title="${i+1} star">★</span>`
  ).join('');
}

function renderLibrary(items) {
  if (!items.length) return `<div class="empty"><div class="empty-icon">💿</div>no albums yet — add some</div>`;
  return `<div class="grid">${items.map(x=>`
    <div class="album-card">
      <div class="album-art" style="background:${artBg(x.album)}">
        <span style="position:relative;z-index:1">${artEmoji(x.artist)}</span>
        <div class="album-art-overlay"></div>
      </div>
      <div class="album-card-body">
        <div class="album-title">${x.album}</div>
        <div class="album-artist">${x.artist}</div>
        <div class="album-footer">
          <span class="format-badge fmt-${x.format.toLowerCase()}">${x.format}</span>
          <div class="stars-row">${starsHtml(x.rating, x.id)}</div>
        </div>
        ${x.notes?`<div style="font-size:10px;color:var(--muted2);margin-top:6px;font-style:italic">${x.notes}</div>`:''}
      </div>
    </div>
  `).join('')}</div>`;
}

function renderWishlist(items) {
  const pending = items.filter(x=>!x.bought);
  const total = pending.reduce((s,x)=>s+x.price,0);
  const budgetBar = `
    <div class="budget-bar">
      <div>
        <div class="budget-label">wishlist total</div>
        <div class="budget-total">$${total.toFixed(2)}</div>
      </div>
      <div class="budget-divider"></div>
      <div>
        <div class="budget-label">pending</div>
        <div style="font-size:16px;font-family:'Syne',sans-serif;font-weight:700;color:var(--text)">${pending.length} albums</div>
      </div>
    </div>
  `;
  if (!items.length) return budgetBar + `<div class="empty"><div class="empty-icon">🎵</div>wishlist is empty</div>`;
  return budgetBar + `<div class="wish-list">${items.map(x=>`
    <div class="wish-row${x.bought?' bought':''}">
      <div class="priority-dot p-${x.priority}"></div>
      <div class="wish-art" style="background:${artBg(x.album)}">${artEmoji(x.artist)}</div>
      <div class="wish-info">
        <div class="wish-title">${x.album}</div>
        <div class="wish-sub">${x.artist} · ${x.year}</div>
        ${x.notes?`<div class="wish-note">${x.notes}</div>`:''}
      </div>
      <div class="wish-meta">
        <span class="genre-pill">${x.genre}</span>
        <span class="price-tag">$${x.price.toFixed(2)}</span>
        ${x.bought
          ? `<span class="owned-pill">✓ owned</span>`
          : `<button class="buy-btn" onclick="markBought(${x.id})">i bought this</button>`
        }
      </div>
    </div>
  `).join('')}</div>`;
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const g = document.getElementById('genre-filter').value;

  const libFiltered = library.filter(x=>
    (!q||x.artist.toLowerCase().includes(q)||x.album.toLowerCase().includes(q))&&
    (!g||x.genre===g)
  );
  const wishFiltered = wishlist.filter(x=>
    (!q||x.artist.toLowerCase().includes(q)||x.album.toLowerCase().includes(q))&&
    (!g||x.genre===g)
  );

  document.getElementById('lib-count').textContent = library.length;
  document.getElementById('wish-count').textContent = wishlist.filter(x=>!x.bought).length;

  const flacs = library.filter(x=>x.format==='FLAC').length;
  const mp3s = library.filter(x=>x.format==='MP3').length;
  const rated = library.filter(x=>x.rating>0);
  const avg = rated.length ? (rated.reduce((s,x)=>s+x.rating,0)/rated.length).toFixed(1) : '—';
  document.getElementById('stat-flac').textContent = flacs;
  document.getElementById('stat-mp3').textContent = mp3s;
  document.getElementById('stat-rating').textContent = avg;

  document.getElementById('content').innerHTML = tab==='library'
    ? renderLibrary(libFiltered)
    : renderWishlist(wishFiltered);
}

function rate(id, n) {
  const x = library.find(x=>x.id===id);
  if(x) { x.rating = n; render(); }
}

function markBought(id) {
  const x = wishlist.find(x=>x.id===id);
  if(!x) return;
  x.bought = true;
  library.push({
    id: library.length+1,
    artist: x.artist, album: x.album, year: x.year, genre: x.genre,
    format:'FLAC', source:'Bandcamp', rating:0, notes:''
  });
  render();
  showToast(`"${x.album}" moved to library`);
}

// modal
function openModal() {
  document.getElementById('lib-fields').style.display = tab==='library'?'block':'none';
  document.getElementById('wish-fields').style.display = tab==='wishlist'?'block':'none';
  document.getElementById('modal-title').textContent = tab==='library' ? 'add to library' : 'add to wishlist';
  clearModal();
  document.getElementById('modal-backdrop').classList.add('open');
}
function closeModal() { document.getElementById('modal-backdrop').classList.remove('open'); }
function closeModalBg(e) { if(e.target===document.getElementById('modal-backdrop')) closeModal(); }
function clearModal() {
  ['f-artist','f-album','f-year','f-notes','f-wish-notes','f-price'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='';
  });
  document.getElementById('f-genre').value='';
  document.getElementById('f-format').value='FLAC';
  document.getElementById('f-source').value='Bandcamp';
  document.getElementById('f-priority').value='mid';
}
function saveItem() {
  const artist = document.getElementById('f-artist').value.trim();
  const album = document.getElementById('f-album').value.trim();
  if(!artist||!album) { showToast('artist and album are required'); return; }
  const year = parseInt(document.getElementById('f-year').value)||new Date().getFullYear();
  const genre = document.getElementById('f-genre').value||'other';

  if(tab==='library') {
    library.push({
      id: library.length+1, artist, album, year, genre,
      format: document.getElementById('f-format').value,
      source: document.getElementById('f-source').value,
      rating: 0,
      notes: document.getElementById('f-notes').value.trim()
    });
    showToast(`"${album}" added to library`);
  } else {
    const price = parseFloat(document.getElementById('f-price').value)||0;
    wishlist.push({
      id: wishlist.length+1, artist, album, year, genre, price,
      priority: document.getElementById('f-priority').value,
      notes: document.getElementById('f-wish-notes').value.trim(),
      bought: false
    });
    showToast(`"${album}" added to wishlist`);
  }
  closeModal();
  render();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}

document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

render();
</script>
</body>
</html>
