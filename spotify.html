<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify History Analyzer</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --accent: #1db954;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .upload-section {
            background-color: var(--surface-color);
            padding: 2rem;
            border-radius: 8px;
            text-align: center;
            border: 2px dashed #333;
            margin-bottom: 2rem;
        }
        input[type="file"] {
            display: none;
        }
        .upload-btn {
            background-color: var(--accent);
            color: #000;
            padding: 10px 24px;
            border-radius: 500px;
            font-weight: bold;
            cursor: pointer;
            display: inline-block;
            margin-top: 10px;
            transition: transform 0.1s;
        }
        .upload-btn:hover {
            transform: scale(1.04);
            background-color: #1ed760;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background-color: var(--surface-color);
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
        }
        .tables-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
        }
        .table-wrapper {
            background-color: var(--surface-color);
            border-radius: 8px;
            padding: 1rem;
            max-height: 600px;
            overflow-y: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #333;
            font-size: 0.9rem;
        }
        th {
            background-color: var(--surface-color);
            color: var(--text-muted);
            font-weight: normal;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .primary-text {
            font-weight: bold;
            color: var(--text-main);
        }
        .secondary-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
        tr:last-child td {
            border-bottom: none;
        }
        /* Custom Scrollbar for tables */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #777;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Extended History Dashboard</h1>
    </div>
    
    <div class="upload-section">
        <h3>Upload your Streaming_History_Audio_*.json files</h3>
        <p style="color: var(--text-muted);">All parsing happens securely in your browser.</p>
        <label for="file-upload" class="upload-btn">Select JSON Files</label>
        <input type="file" id="file-upload" multiple accept=".json">
    </div>

    <div id="results" style="display: none;">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="total-hours">0</div>
                <div>Total Hours Listened</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="unique-artists">0</div>
                <div>Unique Artists</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="unique-albums">0</div>
                <div>Unique Albums</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="unique-tracks">0</div>
                <div>Unique Tracks</div>
            </div>
        </div>

        <div class="tables-container">
            
            <div class="table-wrapper">
                <h2 style="margin-top: 0;">Top Artists</h2>
                <table>
                    <thead><tr><th>#</th><th>Artist</th><th>Hours</th></tr></thead>
                    <tbody id="artist-table-body"></tbody>
                </table>
            </div>

            <div class="table-wrapper">
                <h2 style="margin-top: 0;">Top Albums</h2>
                <table>
                    <thead><tr><th>#</th><th>Album</th><th>Hours</th></tr></thead>
                    <tbody id="album-table-body"></tbody>
                </table>
            </div>

            <div class="table-wrapper">
                <h2 style="margin-top: 0;">Top Tracks</h2>
                <table>
                    <thead><tr><th>#</th><th>Track</th><th>Hours</th></tr></thead>
                    <tbody id="track-table-body"></tbody>
                </table>
            </div>

        </div>
    </div>

    <script>
        document.getElementById('file-upload').addEventListener('change', async (event) => {
            const files = event.target.files;
            if (files.length === 0) return;

            // Simple loading state
            document.querySelector('.upload-section h3').textContent = "Processing files...";

            let allStreams = [];
            
            for (const file of files) {
                const text = await file.text();
                try {
                    const data = JSON.parse(text);
                    allStreams = allStreams.concat(data);
                } catch (e) {
                    console.error("Error parsing file:", file.name);
                }
            }

            processData(allStreams);
            document.querySelector('.upload-section').style.display = 'none'; // Hide upload after processing
        });

        function processData(streams) {
            const artistTimes = {};
            const albumTimes = {};
            const trackTimes = {};
            let totalMs = 0;

            streams.forEach(stream => {
                const artist = stream.master_metadata_album_artist_name;
                const album = stream.master_metadata_album_album_name;
                const track = stream.master_metadata_track_name;
                const msPlayed = stream.ms_played || 0;

                // Filter out podcasts and tracks played for less than 30 seconds
                if (artist && track && msPlayed > 30000) {
                    totalMs += msPlayed;

                    // 1. Process Artists
                    if (!artistTimes[artist]) artistTimes[artist] = 0;
                    artistTimes[artist] += msPlayed;

                    // 2. Process Albums (Composite Key: Album + Artist to avoid name collisions)
                    if (album) {
                        const albumKey = `${album}::${artist}`;
                        if (!albumTimes[albumKey]) albumTimes[albumKey] = { albumName: album, artistName: artist, ms: 0 };
                        albumTimes[albumKey].ms += msPlayed;
                    }

                    // 3. Process Tracks (Composite Key: Track + Artist to avoid name collisions)
                    const trackKey = `${track}::${artist}`;
                    if (!trackTimes[trackKey]) trackTimes[trackKey] = { trackName: track, artistName: artist, ms: 0 };
                    trackTimes[trackKey].ms += msPlayed;
                }
            });

            // Helper function to sort and convert ms to hours
            const formatData = (dataObj, isComposite = false) => {
                return Object.values(dataObj)
                    .map(item => {
                        if (isComposite) {
                            return { ...item, hours: item.ms / (1000 * 60 * 60) };
                        } else {
                            // For artists where the data was just a flat mapping of name -> ms
                            return { name: Object.keys(dataObj).find(key => dataObj[key] === item), hours: item / (1000 * 60 * 60) };
                        }
                    })
                    // Fallback sorting logic for flat mapping
                    .map(item => isComposite ? item : {name: item.name, hours: item.hours})
                    .sort((a, b) => b.hours - a.hours);
            };

            // Process artists differently because it's a flat object { "Artist": ms }
            const sortedArtists = Object.entries(artistTimes)
                .map(([name, ms]) => ({ name, hours: ms / (1000 * 60 * 60) }))
                .sort((a, b) => b.hours - a.hours);

            const sortedAlbums = formatData(albumTimes, true);
            const sortedTracks = formatData(trackTimes, true);

            displayResults(totalMs, sortedArtists, sortedAlbums, sortedTracks);
        }

        function displayResults(totalMs, artists, albums, tracks) {
            document.getElementById('results').style.display = 'block';
            
            // Update Stat Cards
            document.getElementById('total-hours').textContent = (totalMs / (1000 * 60 * 60)).toFixed(1);
            document.getElementById('unique-artists').textContent = artists.length.toLocaleString();
            document.getElementById('unique-albums').textContent = albums.length.toLocaleString();
            document.getElementById('unique-tracks').textContent = tracks.length.toLocaleString();

            // Populate Artists
            const artistBody = document.getElementById('artist-table-body');
            artists.slice(0, 100).forEach((artist, index) => {
                artistBody.innerHTML += `<tr>
                    <td>${index + 1}</td>
                    <td class="primary-text">${artist.name}</td>
                    <td>${artist.hours.toFixed(1)}</td>
                </tr>`;
            });

            // Populate Albums
            const albumBody = document.getElementById('album-table-body');
            albums.slice(0, 100).forEach((album, index) => {
                albumBody.innerHTML += `<tr>
                    <td>${index + 1}</td>
                    <td>
                        <div class="primary-text">${album.albumName}</div>
                        <div class="secondary-text">${album.artistName}</div>
                    </td>
                    <td>${album.hours.toFixed(1)}</td>
                </tr>`;
            });

            // Populate Tracks
            const trackBody = document.getElementById('track-table-body');
            tracks.slice(0, 100).forEach((track, index) => {
                trackBody.innerHTML += `<tr>
                    <td>${index + 1}</td>
                    <td>
                        <div class="primary-text">${track.trackName}</div>
                        <div class="secondary-text">${track.artistName}</div>
                    </td>
                    <td>${track.hours.toFixed(1)}</td>
                </tr>`;
            });
        }
    </script>
</body>
</html>
