<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify History Analyzer</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --accent: #1db954;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        .upload-section {
            background-color: var(--surface-color);
            padding: 2rem;
            border-radius: 8px;
            text-align: center;
            border: 2px dashed #333;
            margin-bottom: 2rem;
        }
        input[type="file"] {
            display: none;
        }
        .upload-btn {
            background-color: var(--accent);
            color: #000;
            padding: 10px 24px;
            border-radius: 500px;
            font-weight: bold;
            cursor: pointer;
            display: inline-block;
            margin-top: 10px;
            transition: transform 0.1s;
        }
        .upload-btn:hover {
            transform: scale(1.04);
            background-color: #1ed760;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background-color: var(--surface-color);
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--surface-color);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th {
            background-color: #282828;
            color: var(--text-muted);
            font-weight: normal;
        }
        tr:last-child td {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <h1>Extended History Dashboard</h1>
    
    <div class="upload-section">
        <h3>Upload your Streaming_History_Audio_*.json files</h3>
        <p style="color: var(--text-muted);">All parsing happens securely in your browser.</p>
        <label for="file-upload" class="upload-btn">Select JSON Files</label>
        <input type="file" id="file-upload" multiple accept=".json">
    </div>

    <div id="results" style="display: none;">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="total-hours">0</div>
                <div>Total Hours Listened</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="unique-artists">0</div>
                <div>Unique Artists</div>
            </div>
        </div>

        <h2>Top Artists</h2>
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Artist</th>
                    <th>Hours Listened</th>
                </tr>
            </thead>
            <tbody id="artist-table-body">
                </tbody>
        </table>
    </div>

    <script>
        document.getElementById('file-upload').addEventListener('change', async (event) => {
            const files = event.target.files;
            if (files.length === 0) return;

            let allStreams = [];
            
            // Read and parse all uploaded files
            for (const file of files) {
                const text = await file.text();
                try {
                    const data = JSON.parse(text);
                    allStreams = allStreams.concat(data);
                } catch (e) {
                    console.error("Error parsing file:", file.name);
                }
            }

            processData(allStreams);
        });

        function processData(streams) {
            const artistTimes = {};
            let totalMs = 0;

            streams.forEach(stream => {
                // Spotify's extended history uses master_metadata_album_artist_name
                const artist = stream.master_metadata_album_artist_name;
                const msPlayed = stream.ms_played || 0;

                // Filter out podcasts and tracks played for less than 30 seconds
                if (artist && msPlayed > 30000) {
                    totalMs += msPlayed;
                    if (!artistTimes[artist]) {
                        artistTimes[artist] = 0;
                    }
                    artistTimes[artist] += msPlayed;
                }
            });

            // Convert to array and sort by time played
            const sortedArtists = Object.entries(artistTimes)
                .map(([name, ms]) => ({ name, hours: ms / (1000 * 60 * 60) }))
                .sort((a, b) => b.hours - a.hours);

            displayResults(totalMs, sortedArtists);
        }

        function displayResults(totalMs, sortedArtists) {
            document.getElementById('results').style.display = 'block';
            
            // Update Top Stats
            const totalHours = (totalMs / (1000 * 60 * 60)).toFixed(1);
            document.getElementById('total-hours').textContent = totalHours;
            document.getElementById('unique-artists').textContent = sortedArtists.length.toLocaleString();

            // Populate Table
            const tbody = document.getElementById('artist-table-body');
            tbody.innerHTML = ''; // Clear previous

            // Show Top 50 Artists
            sortedArtists.slice(0, 50).forEach((artist, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td style="font-weight: bold;">${artist.name}</td>
                    <td>${artist.hours.toFixed(1)} hrs</td>
                `;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
